"/root/.pm2/logs/JARVIS-out.log"
"/root/.pm2/logs/JARVIS-error.log"
"/root/.pm2/logs/JARVIS-OS-out.log"
"/root/.pm2/logs/JARVIS-OS-error.log"
"/root/.pm2/logs/KRONOS-API-out.log"
"/root/.pm2/logs/KRONOS-API-error.log" {
    daily
    maxsize 100M
    rotate -1
    maxage 30
    missingok
    ifempty
    create 0600 root root
    su root root
    dateext
    dateformat -%Y%m%d-%H%M%S
    compress
    compressoptions -1
    nodelaycompress
    olddir /root/.pm2/logs/rotated
    sharedscripts
    postrotate
        /usr/bin/python3 /opt/JARVIS/scripts/ops/pm2_log_reopen.py --archive-dir /root/.pm2/logs/rotated
    endscript
}
