# Publish all proposals before reporting successful completion.
# A failure must NOT look like a complete cycle: OnFailure sends an incomplete digest.
[Service]
ExecStartPost=/root/.nvm/versions/node/v24.19.0/bin/npx tsx /opt/JARVIS/scripts/ops/risk_allocator.ts --write
ExecStartPost=/root/.nvm/versions/node/v24.19.0/bin/npx tsx /opt/JARVIS/scripts/ops/shutdown_proposal.ts --write
# Paper mode (09-nov-2026): simula los activos apagados y publica evidencia paper ANTES
# del roster, que la lee para marcar "paperReady" (propuesta de activación, nunca auto-apply).
# Best-effort: si falla, el roster sigue con la evidencia paper previa.
ExecStartPost=-/root/.nvm/versions/node/v24.19.0/bin/npx tsx /opt/JARVIS/scripts/ops/paper_trades.ts --apply
ExecStartPost=/root/.nvm/versions/node/v24.19.0/bin/npx tsx /opt/JARVIS/scripts/ops/roster_proposal.ts --write
